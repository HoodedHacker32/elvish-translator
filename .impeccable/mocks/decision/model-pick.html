<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a3039,#1d2128 70%);color:#e9eef5;font:15px Figtree,sans-serif}
header{display:flex;justify-content:space-between;padding:24px 48px;color:#8a95a6}
.brand{font:20px Marcellus,serif;color:#e9eef5}
.in{margin:24px auto 0;width:760px;display:flex;border:1px solid #474f5c;border-radius:4px;background:#252a32}
.in div{flex:1;padding:16px 20px;font-size:20px;color:#cfd6e0}
.in span{padding:16px 22px;background:#9fc3ff;color:#0f1a2b;font-weight:500}
.arch{margin:60px auto 0;width:980px;height:520px;border:2px solid rgba(159,195,255,.55);border-bottom:none;border-radius:490px 490px 0 0;
box-shadow:0 0 30px rgba(159,195,255,.18) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.elv{font:68px Marcellus,serif;text-shadow:0 0 18px rgba(159,195,255,.7)}
.teng{margin-top:22px;font:30px Marcellus,serif;color:#9fc3ff;letter-spacing:.25em;text-shadow:0 0 12px rgba(159,195,255,.6)}
.gl{margin-top:30px;color:#8a95a6;font-size:16px}
.star{width:60px;height:60px;margin-bottom:26px;border:1px solid #9fc3ff;transform:rotate(45deg)}
</style></head><body>
<header><div class="brand">Lambë Edhellen</div><div>Sindarin · Quenya · Lexicon</div></header>
<div class="in"><div>Speak, friend, and enter</div><span>Translate</span></div>
<div class="arch"><div class="star"></div><div class="elv">Pedo mellon a minno</div><div class="teng">ᛈᛖᛞᛟ · ᛗᛖᛚᛚᛟᚾ · ᚨ · ᛗᛁᚾᚾᛟ</div>
<div class="gl">Canon inscription — the West-gate of Moria, <i>FotR</i> II.4</div></div>
</body></html>
