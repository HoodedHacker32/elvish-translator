<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital@0;1&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#14203b;color:#f2f0e6;font:15px Figtree,sans-serif;
background-image:linear-gradient(rgba(142,160,196,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(142,160,196,.12) 1px,transparent 1px);background-size:120px 120px}
header{display:flex;gap:32px;align-items:center;padding:22px 40px;border-bottom:1px solid rgba(142,160,196,.3)}
.brand{font:italic 24px Alegreya,serif}
.side{position:absolute;left:40px;top:100px;width:360px;background:rgba(20,32,59,.9);border:1px solid rgba(142,160,196,.4);padding:22px}
.side .t{font-size:22px;margin:10px 0 18px}
.btn{display:inline-block;background:#e0533d;padding:10px 18px;color:#fff}
.sky{position:absolute;left:460px;top:120px;width:920px;height:600px}
.st{position:absolute;border-radius:50%;background:#f2f0e6;box-shadow:0 0 12px #f2f0e6}
.lab{position:absolute;font:italic 26px Alegreya,serif}
.gl{position:absolute;font-size:13px;color:#8ea0c4}
.line{position:absolute;height:1px;background:rgba(242,240,230,.5);transform-origin:0 0}
.read{position:absolute;left:460px;bottom:60px;font:44px Alegreya,serif}
.read small{display:block;font:13px Figtree;color:#e0533d;letter-spacing:.14em;margin-bottom:6px}
</style></head><body>
<header><div class="brand">Lambë Edhellen</div><span>Sindarin</span><span style="color:#8ea0c4">Quenya</span></header>
<div class="side"><div style="font-size:12px;letter-spacing:.14em;color:#8ea0c4">ENGLISH</div><div class="t">O Elbereth Star-kindler</div><span class="btn">Plot phrase</span></div>
<div class="sky">
<div class="line" style="left:90px;top:300px;width:280px;transform:rotate(-25deg)"></div>
<div class="line" style="left:345px;top:182px;width:300px;transform:rotate(28deg)"></div>
<div class="st" style="left:80px;top:290px;width:22px;height:22px"></div><div class="lab" style="left:60px;top:320px">A</div><div class="gl" style="left:60px;top:360px">O · attested</div>
<div class="st" style="left:335px;top:170px;width:30px;height:30px"></div><div class="lab" style="left:300px;top:110px">Elbereth</div><div class="gl" style="left:300px;top:90px">Star-queen · attested</div>
<div class="st" style="left:620px;top:310px;width:26px;height:26px"></div><div class="lab" style="left:600px;top:345px">Gilthoniel</div><div class="gl" style="left:600px;top:385px">Star-kindler · attested</div>
</div>
<div class="read"><small>READ AS LINE</small>A Elbereth Gilthoniel</div>
</body></html>
